name: Bug report
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Right-click on ...
        2. Select ...
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown in Settings > About.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Run `winver` to see it.
      placeholder: Windows 11 24H2 (26100.1234)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or other details
