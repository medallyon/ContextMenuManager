name: winget

# Opens a winget-pkgs pull request for each published release.
# Needs the first version merged into winget-pkgs by hand, and a WINGET_TOKEN secret:
# a classic PAT with public_repo scope, from an account with a fork of microsoft/winget-pkgs.
on:
  release:
    types: [released]

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Medallyon.ContextMenuManager
          installers-regex: '\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
