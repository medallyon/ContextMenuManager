name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish src/ContextMenuManager.App -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} -o publish

      - name: Zip
        run: Compress-Archive -Path publish/* -DestinationPath ContextMenuManager-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ContextMenuManager-${{ matrix.rid }}
          path: ContextMenuManager-${{ matrix.rid }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          draft: true
